name: Recolha diária de dados

on:
  schedule:
    - cron: "0 8 * * *"   # todos os dias às 08:00 UTC
  workflow_dispatch:       

permissions:
  contents: write          

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descarregar dados do SNS
        run: python -m src.ingest.sns

      - name: Descarregar meteorologia
        run: python -m src.ingest.meteo

      - name: Testes
        run: python -m pytest -q

      - name: Commit dos dados novos 
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "dados: recolha de $(date -u +%Y-%m-%d)"
            git push
          fi
